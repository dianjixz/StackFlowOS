<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c10">
  <title>StackFlow OS · 操作台</title>
  <link rel="stylesheet" href="/css/os.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" width="0" height="0" focusable="false">
    <defs>
      <symbol id="i-brand" viewBox="0 0 24 24">
        <path d="M12 2.8 21 7.4l-9 4.6L3 7.4l9-4.6Z" fill="currentColor" opacity=".95"/>
        <path d="m3 12 9 4.6 9-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".75"/>
        <path d="m3 16.6 9 4.6 9-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".45"/>
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.4-4.9A7.5 7.5 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M8.4 11.6h.01M12 11.6h.01M15.6 11.6h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-panel" viewBox="0 0 24 24">
        <rect x="3.2" y="3.6" width="17.6" height="16.8" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M9.8 3.8v16.4M9.8 9h10.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M13.2 12.4h4.2M13.2 15.6h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-projects" viewBox="0 0 24 24">
        <path d="M3.4 7.4c0-1 .8-1.8 1.8-1.8h4l2 2.2h6.6c1 0 1.8.8 1.8 1.8v8c0 1-.8 1.8-1.8 1.8H5.2c-1 0-1.8-.8-1.8-1.8V7.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M3.8 10.4h16.4" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
      </symbol>
      <symbol id="i-agents" viewBox="0 0 24 24">
        <circle cx="9" cy="8.4" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3.6 19.2c.3-3 2.6-5 5.4-5s5.1 2 5.4 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="17" cy="9.4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/>
        <path d="M15.5 14.6c2.1.2 3.9 1.8 4.2 4.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
      </symbol>
      <symbol id="i-units" viewBox="0 0 24 24">
        <rect x="5.2" y="5.2" width="13.6" height="13.6" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M9.4 9.4h5.2v5.2H9.4z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 2.8v2.2M15 2.8v2.2M9 19v2.2M15 19v2.2M2.8 9h2.2M2.8 15h2.2M19 9h2.2M19 15h2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-approvals" viewBox="0 0 24 24">
        <path d="M12 2.9 19.6 6v5.4c0 4.3-2.9 7.7-7.6 9.7-4.7-2-7.6-5.4-7.6-9.7V6L12 2.9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m8.7 11.9 2.2 2.2 4.4-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-events" viewBox="0 0 24 24">
        <path d="M2.8 12.2h4l2.1-5.6 3.7 11.2 2.4-7 1.4 3.1h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M19.4 12.8a7.6 7.6 0 0 0 .1-1.6 7.6 7.6 0 0 0-.1-1.6l2-1.4-2-3.4-2.4 1a7.8 7.8 0 0 0-2.7-1.6L14 2.8h-4l-.3 2.4a7.8 7.8 0 0 0-2.7 1.6l-2.4-1-2 3.4 2 1.4a7.6 7.6 0 0 0 0 3.2l-2 1.4 2 3.4 2.4-1a7.8 7.8 0 0 0 2.7 1.6l.3 2.4h4l.3-2.4a7.8 7.8 0 0 0 2.7-1.6l2.4 1 2-3.4-2-1.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M4.2 11.4 20 4.4l-7 15.8-2.3-6.4-6.5-2.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m10.7 13.8 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6.4 6.4 11.2 11.2M17.6 6.4 6.4 17.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 5.6 6.4 6.4L9 18.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5.2v13.6M5.2 12h13.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M19.4 9.2A7.8 7.8 0 1 0 20 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M20 4.4v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5.4 12.6 4.2 4.2L18.8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4.8 7.2h14.4M9.4 7V5.2c0-.8.6-1.4 1.4-1.4h2.4c.8 0 1.4.6 1.4 1.4V7M7 7.2l.8 11.2c.1 1 .9 1.8 2 1.8h4.4c1.1 0 1.9-.8 2-1.8L17 7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.4 10.4v6M13.6 10.4v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 7.4V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24">
        <path d="M12 4.8v14.4M6.4 13.6 12 19.2l5.6-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M19 12H5M11 5.6 4.6 12l6.4 6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <rect x="3" y="4.4" width="18" height="15.2" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="m7.2 9.4 2.8 2.8-2.8 2.8M12.6 15h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 3.4 21 19.6H3L12 3.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 9.2v4.6M12 16.8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#chat-log">跳到对话</a>

  <div class="os-shell" id="os-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-brand"></use></svg>
        </span>
        <span class="brand-text">STACKFLOW <b>OS</b></span>
        <span class="brand-host mono" id="sys-host" title="主机">—</span>
      </div>

      <div class="topbar-right">
        <span class="transport-pill" id="transport-pill" title="传输模式">
          <span class="transport-dot" aria-hidden="true"></span><span id="transport-label">IPC</span>
        </span>
        <span class="stat-chip" title="在线单元">
          <span class="status-dot is-online" aria-hidden="true"></span><span class="mono" id="stat-units">—</span><span class="chip-label">单元</span>
        </span>
        <span class="stat-chip" title="活跃租约">
          <svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-clock"></use></svg>
          <span class="mono" id="stat-leases">—</span><span class="chip-label">租约</span>
        </span>
        <button class="approval-badge" id="topbar-approvals" type="button" aria-label="打开审批中心" title="审批中心">
          <svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-approvals"></use></svg>
          <span class="mono" id="topbar-approval-count">0</span>
        </button>
        <time class="clock mono" id="clock" datetime="">--:--</time>
      </div>
    </header>

    <main class="workspace" id="workspace" data-view="chat">
      <section class="pane chat-pane" id="chat-pane" aria-labelledby="chat-heading">
        <header class="pane-head">
          <div class="pane-title">
            <h1 id="chat-heading">对话</h1>
            <p class="pane-sub" id="chat-sub">系统助手 · 待命</p>
          </div>
          <span class="stream-state" id="sse-state" data-state="connecting" title="事件流状态">
            <span class="status-dot" aria-hidden="true"></span><span id="sse-label">连接中</span>
          </span>
        </header>

        <div class="chat-context" id="chat-context" hidden aria-live="polite"></div>

        <div class="chat-scroll" id="chat-scroll">
          <ol class="chat-log" id="chat-log" aria-live="polite" aria-relevant="additions text"></ol>
          <div class="chat-loading" id="chat-loading" hidden>
            <span class="spinner" aria-hidden="true"></span><span>正在载入会话…</span>
          </div>
          <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="回到底部" hidden>
            <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-arrow-down"></use></svg>
          </button>
        </div>

        <div class="composer-wrap">
          <div class="suggestions" id="suggestions" aria-label="快捷建议"></div>
          <form class="composer" id="composer-form" autocomplete="off">
            <label class="sr-only" for="composer-input">对系统说点什么</label>
            <textarea id="composer-input" class="composer-input" rows="1" maxlength="8000"
                      placeholder="对系统说点什么…（Enter 发送）"></textarea>
            <button class="send-btn" id="send-btn" type="submit" aria-label="发送消息">
              <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-send"></use></svg>
            </button>
          </form>
          <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 高风险动作需人工审批</p>
        </div>
      </section>

      <section class="pane work-pane" id="work-pane" aria-labelledby="work-heading">
        <header class="pane-head">
          <div class="pane-title">
            <h2 id="work-heading">工作面板</h2>
            <p class="pane-sub">项目 · 在岗 Agent · 事件流</p>
          </div>
          <button class="ghost-btn" type="button" data-open-app="projects">
            全部项目<svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron"></use></svg>
          </button>
        </header>

        <div class="work-scroll" id="work-scroll">
          <section class="block projects-block" aria-labelledby="projects-label">
            <div class="section-label">
              <h3 id="projects-label">项目</h3>
              <span class="muted mono" id="project-count"></span>
            </div>
            <div class="project-grid" id="project-grid"></div>
          </section>

          <section class="block agents-block" aria-labelledby="agents-label">
            <div class="section-label">
              <h3 id="agents-label">在岗 Agent</h3>
              <span class="muted mono" id="agent-count"></span>
            </div>
            <div class="agent-strip" id="agent-strip"></div>
          </section>

          <section class="block events-block" aria-labelledby="events-label">
            <div class="section-label">
              <h3 id="events-label">实时事件</h3>
              <button class="text-btn" type="button" data-open-app="events">
                全部<svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron"></use></svg>
              </button>
            </div>
            <ul class="event-ticker" id="event-ticker"></ul>
          </section>
        </div>
      </section>
    </main>

    <div class="mobile-tabs" role="tablist" aria-label="主视图切换">
      <button class="mobile-tab is-active" type="button" role="tab" aria-selected="true"
              aria-controls="chat-pane" data-mobile-view="chat">
        <svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chat"></use></svg>对话
      </button>
      <button class="mobile-tab" type="button" role="tab" aria-selected="false"
              aria-controls="work-pane" data-mobile-view="work">
        <svg class="ico ico-sm" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-panel"></use></svg>工作面板
      </button>
    </div>

    <nav class="dock" id="dock" aria-label="应用坞">
      <button class="dock-btn" type="button" data-open-app="projects" aria-label="打开项目">
        <span class="dock-icon"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-projects"></use></svg></span>
        <span class="dock-label">项目</span>
      </button>
      <button class="dock-btn" type="button" data-open-app="agents" aria-label="打开 Agent 花名册">
        <span class="dock-icon"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-agents"></use></svg></span>
        <span class="dock-label">Agent</span>
      </button>
      <button class="dock-btn" type="button" data-open-app="units" aria-label="打开单元列表">
        <span class="dock-icon"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-units"></use></svg></span>
        <span class="dock-label">单元</span>
      </button>
      <button class="dock-btn" id="dock-approvals" type="button" data-open-app="approvals" aria-label="打开审批中心">
        <span class="dock-icon">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-approvals"></use></svg>
          <span class="dock-badge" id="dock-approval-badge" hidden>0</span>
        </span>
        <span class="dock-label">审批</span>
      </button>
      <button class="dock-btn" type="button" data-open-app="events" aria-label="打开事件控制台">
        <span class="dock-icon"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-events"></use></svg></span>
        <span class="dock-label">事件</span>
      </button>
      <button class="dock-btn" type="button" data-open-app="settings" aria-label="打开设置">
        <span class="dock-icon"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-settings"></use></svg></span>
        <span class="dock-label">设置</span>
      </button>
    </nav>
  </div>

  <div class="sheet-layer" id="sheet-layer" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <header class="sheet-head">
        <div class="sheet-title-wrap">
          <span class="sheet-icon" id="sheet-icon" aria-hidden="true"></span>
          <div>
            <h2 class="sheet-title" id="sheet-title">应用</h2>
            <p class="sheet-sub" id="sheet-sub"></p>
          </div>
        </div>
        <button class="icon-btn sheet-close" id="sheet-close" type="button" aria-label="关闭应用">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="assertive"></div>

  <noscript>
    <div class="noscript">StackFlowOS 操作台需要启用 JavaScript。</div>
  </noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
